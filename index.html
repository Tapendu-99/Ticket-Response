<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ticket Response Templates</title>
<style>
  :root{
    --ink:#20211f;
    --paper:#faf7f2;
    --panel:#ffffff;
    --line:#e4ddd1;
    --rust:#c4491f;
    --rust-dark:#9c3717;
    --olive:#5c6b4c;
    --muted:#8a8578;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --serif: "Iowan Old Style", "Georgia", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
  }
  .wrap{
    width:100%;
    max-width:760px;
  }
  header{
    margin-bottom:22px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--rust);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .eyebrow::before{
    content:"";
    width:16px;height:1px;
    background:var(--rust);
    display:inline-block;
  }
  h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:30px;
    line-height:1.15;
    margin:0 0 6px;
    letter-spacing:-.01em;
  }
  .sub{
    color:var(--muted);
    font-size:14.5px;
    line-height:1.5;
    max-width:56ch;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 1px 2px rgba(32,33,31,.03), 0 12px 32px -20px rgba(32,33,31,.25);
    overflow:hidden;
  }

  .select-row{
    padding:20px 20px 16px;
    border-bottom:1px solid var(--line);
  }
  .select-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:9px;
    display:block;
  }
  .select-shell{
    position:relative;
  }
  select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:13px 42px 13px 14px;
    font-size:15.5px;
    font-family:var(--sans);
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease;
  }
  select:hover{border-color:var(--rust);}
  select:focus{outline:none;border-color:var(--rust);box-shadow:0 0 0 3px rgba(196,73,31,.12);}
  .select-shell::after{
    content:"";
    position:absolute;
    right:16px; top:50%;
    width:9px;height:9px;
    border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted);
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }
  .meta{
    margin-top:11px;
    font-size:12.5px;
    color:var(--olive);
    line-height:1.5;
    display:none;
  }
  .meta.show{display:block;}
  .meta b{color:var(--ink);font-weight:600;}

  .editor-row{
    padding:18px 20px 20px;
  }
  textarea{
    width:100%;
    min-height:340px;
    resize:vertical;
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:16px 18px;
    font-family:var(--sans);
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink);
    background:var(--paper);
    transition:border-color .15s ease;
  }
  textarea:focus{outline:none;border-color:var(--rust);box-shadow:0 0 0 3px rgba(196,73,31,.1);}

  .actions{
    display:flex;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  button{
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    border-radius:9px;
    padding:12px 18px;
    border:none;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform .1s ease, background .15s ease, box-shadow .15s ease;
    flex:1 1 140px;
    justify-content:center;
  }
  button:active{transform:scale(.97);}
  .btn-copy{
    background:var(--rust);
    color:#fff;
    box-shadow:0 6px 16px -8px rgba(196,73,31,.6);
  }
  .btn-copy:hover{background:var(--rust-dark);}
  .btn-reset{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--line);
  }
  .btn-reset:hover{border-color:var(--olive);color:var(--olive);}
  svg{width:15px;height:15px;flex-shrink:0;}

  .toast{
    position:fixed;
    bottom:26px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:11px 20px;
    border-radius:99px;
    font-size:13.5px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
    white-space:nowrap;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  footer{
    margin-top:20px;
    text-align:center;
    font-size:12px;
    line-height:1.8;
    color:var(--muted);
    font-family:var(--mono);
  }

  @media (max-width:480px){
    body{padding:20px 12px 50px;}
    h1{font-size:24px;}
    .select-row{padding:16px 16px 14px;}
    .editor-row{padding:16px;}
    textarea{min-height:300px;font-size:14px;padding:14px;}
    button{flex:1 1 100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Merchant Training Team</span>
    <h1>Ticket Response Templates</h1>
    <p class="sub">Pick a template from the dropdown, tweak the placeholders, then copy it straight into your reply.</p>
  </header>

  <div class="card">
    <div class="select-row">
      <label class="select-label" for="templateSelect">Template</label>
      <div class="select-shell">
        <select id="templateSelect"></select>
      </div>
      <p class="meta" id="metaLine"></p>
    </div>

    <div class="editor-row">
      <textarea id="editor" spellcheck="false"></textarea>
      <div class="actions">
        <button class="btn-copy" id="copyBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy content
        </button>
        <button class="btn-reset" id="resetBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
          Reset content
        </button>
      </div>
    </div>
  </div>

  <footer>Templates stay saved in this tab only — nothing is sent anywhere.<br>Application created by Tapendu © 2026, July</footer>
</div>

<div class="toast" id="toast"></div>

<script>
const templates = [
  {
    sn: "01",
    title: "Ticket Acknowledgement",
    meta: "Sent automatically on ticket creation, by the auto-assignment system · Audience: Customer & Team",
    body: `Dear Customer,,

Greetings from Petpooja!

Thank you for contacting the Merchant Training Team.

Your request has been successfully received and reviewed. We are pleased to confirm that your [Virtual / Physical / Out of Station] training request has been assigned to one of our trainers, who will contact you shortly to schedule and conduct the training session.

I&T Turnaround Time (TAT) (Except Sunday & Public Holidays)
Virtual Training   : Up to 24 hours
Physical Visit     : Within 48–72 hours
Outstation Visit   : Within 72–120 hours

Note: TAT is calculated from the time the ticket is assigned and all required information and prerequisites are complete. Delays due to merchant unavailability, rescheduling requests, public holidays, remote locations, unexpected emergencies or force majeure are excluded from the committed TAT. Onsite Visit TAT is subject to the real-time availability of resources at or near the outlet location.

Regards,
Merchant Training Team`
  },
  {
    sn: "02",
    title: "Trainer Noted",
    meta: "Trainer acknowledges the assigned ticket · Audience: Customer & Team",
    body: `Dear Customer,

Greetings from Petpooja!

I acknowledge your training request and will connect with you shortly.

I&T Turnaround Time (TAT) (Except Sunday & Public Holidays)
Virtual Training   : Up to 24 hours
Physical Visit     : Within 48–72 hours
Outstation Visit   : Within 72–120 hours

Note: TAT is calculated from the time the ticket is assigned and all required information and prerequisites are complete. Delays due to merchant unavailability, rescheduling requests, public holidays, remote locations, unexpected emergencies or force majeure are excluded from the committed TAT. Onsite Visit TAT is subject to the real-time availability of resources at or near the outlet location.

Regards,
Trainer Name & Signature`
  },
  {
    sn: "03",
    title: "Training Scheduled / Rescheduled",
    meta: "Sent once a session date is fixed or moved · Audience: Customer",
    body: `Dear Customer,

Greetings from Petpooja!

Your training has been scheduled / rescheduled.

Schedule / reschedule details & reason
Date & Time:
Mode: Virtual / Physical
Reason:

Kindly ensure the required hardware device, network (internet connection) and concerned staff are available.
If you are unavailable at the scheduled time, please inform us in advance to avoid delays.

Thank you for your understanding.

Regards,
Trainer Name & Signature`
  },
  {
    sn: "04",
    title: "Follow-up Attempt — Not Connected",
    meta: "Merchant unreachable after repeated contact attempts · Audience: Customer & Team",
    body: `Dear Customer,

Greetings from Petpooja!

I have attempted to contact you regarding your assigned [Product Name] training. Despite multiple attempts, I have been unable to reach you due to [Number Not Reachable / Switched Off / Ringing – No Answer / Busy / Call Declined / Invalid Number].

Kindly reply to this email or contact us at your convenience so that we can schedule your training and assist you further.
If we do not receive a response, the ticket may be reassigned or closed as per process and TAT.

Attempts made (attach evidence)
Call 1: DD/MM/YYYY – 10:30 AM – No Answer
Call 2: DD/MM/YYYY – 2:15 PM – Busy
WhatsApp: Sent – Delivered

I&T Turnaround Time (TAT) (Except Sunday & Public Holidays)
Virtual Training   : Up to 24 hours
Physical Visit     : Within 48–72 hours
Outstation Visit   : Within 72–120 hours

Note: TAT is calculated from the time the ticket is assigned and all required information and prerequisites are complete. Delays due to merchant unavailability, rescheduling requests, public holidays, remote locations, unexpected emergencies or force majeure are excluded from the committed TAT. Onsite Visit TAT is subject to the real-time availability of resources at or near the outlet location.

Regards,
Trainer Name & Signature`
  },
  {
    sn: "05",
    title: "Ticket Reassigned (by Trainer)",
    meta: "Trainer cannot service the ticket and requests reassignment · Audience: Internal — Training Team",
    body: `Dear Team,

Greetings from Petpooja!

To ensure timely service and avoid delay, kindly reassign this ticket to another available trainer.

Reason: [Scheduled Physical Visit / Outstation Visit / Leave / Weekly Off / Emergency / Network Issue / Other]

Regards,
Trainer Name & Signature`
  },
  {
    sn: "06",
    title: "Parallel Setup Completed",
    meta: "Confirming a completed parallel setup · Audience: Customer",
    body: `Dear Customer,

Greetings from Petpooja!

Thank you for your time. This email confirms that the parallel setup has been successfully conducted.

Date of Setup: DD / MM / YYYY
Restaurant ID / ORG ID:
Restaurant Name/Business Name:
User Type: NPU (Non-Petpooja User) / PPU (Petpooja User)
Name of Person:
Contact of Trainee:
Training Type: New
Training Mode: Virtual
Product: POS / Payroll / PP Invoice etc.
Sub-product: POS Basic / POS+Growth / POS+Scale / Local POS Basic
Training Start Time: HH:MM AM/PM
Training End Time: HH:MM AM/PM
Notes: device count, billing status, pending task (complete for physical visits)

Parallel Setup Attachment (Mandatory)

If Incomplete: mention the reason with a supportive attachment.

Regards,
Trainer Name & Signature`
  },
  {
    sn: "07",
    title: "Training Completed",
    meta: "Session finished and ticket closed — acknowledgement to merchant · Audience: Customer",
    body: `Dear Customer,

Greetings from Petpooja!

Thank you for your time. This email confirms that the Physical / Virtual / Out of Station training session has been successfully conducted and the ticket is now closed.

Date: DD / MM / YYYY
Restaurant ID / ORG ID:
Restaurant Name/Business Name:
User Type: NPU (Non-Petpooja User) / PPU (Petpooja User)
Name of Person:
Contact of Trainee:
Training Type: New / Retraining / Support Issue
Retraining Reason: (required if Training Type = Retraining or Support Issue)
Training Mode: Physical / Virtual / Out of station
Product: POS / Payroll / PP Invoice etc.
Sub-product: POS Basic / POS+Growth / POS+Scale / Local POS Basic
Product Features Covered:
Marketplace Services Covered: as per client plan or individual services bought
Training Start Time: HH:MM AM/PM
Training End Time: HH:MM AM/PM
Training Status: Completed / Incomplete
Owner Dashboard: Yes / No
AI Agent (Petpooja): Yes / No (mandatory if Owner Dashboard = Yes)
Training Attended By: Owner / Manager / Staff Name
Parallel Setup Done: Yes / No / Already Done Remotely

Product and Services Covered Attachment (Mandatory)

If Incomplete: mention the reason with a supportive attachment (outlet photo).
Pending Services / Product (I&T): mention any pending item with the reason.

Special Note / Instructions: any location or setup exceptions — e.g. training conducted at another office, remote device setup, development requirement requested, issue unresolved, replacement, or other specific scenario to highlight.

We hope the session was informative. For any questions or further assistance, reach us any time on +91 79 6922 3344 (available 24×7) or support@petpooja.com. Kindly acknowledge receipt of this email.

We also welcome your feedback — it helps us keep improving our service.
Feedback link: https://forms.gle/XXHMVTV8xxZH3AXg6

Regards,
Trainer Name & Signature`
  },
  {
    sn: "08",
    title: "Training Request On Hold — Pending Merchant Action",
    meta: "Prerequisites incomplete; training paused pending merchant · Audience: Customer",
    body: `Dear Customer,

Greetings from Petpooja!

Your training is currently on hold due to pending prerequisites.

Pending items
●  Menu not shared
●  Networking (internet) unavailable
●  Hardware (POS device) unavailable
●  Printer unavailable
●  Other: ____________________

Please update us once these are complete.
(Tag the respective Sales POC.)

I&T Turnaround Time (TAT) (Except Sunday & Public Holidays)
Virtual Training   : Up to 24 hours
Physical Visit     : Within 48–72 hours
Outstation Visit   : Within 72–120 hours

Note: TAT is calculated from the time the ticket is assigned and all required information and prerequisites are complete. Delays due to merchant unavailability, rescheduling requests, public holidays, remote locations, unexpected emergencies or force majeure are excluded from the committed TAT. Onsite Visit TAT is subject to the real-time availability of resources at or near the outlet location.

Regards,
Trainer Name & Signature`
  },
  {
    sn: "09",
    title: "TL → Trainer Assignment",
    meta: "Team lead assigns a trainer to the ticket · Audience: Customer & Team",
    body: `Dear Customer,

Greetings from Petpooja!

Thank you for contacting the Merchant Training Team. Your request has been received and assigned to our trainer.

@Trainer Name — please take note and coordinate with the customer to conduct the training session at the earliest.
@Trainer Name — please take note and coordinate with the customer to conduct the parallel setup at the earliest.

I&T Turnaround Time (TAT) (Except Sunday & Public Holidays)
Virtual Training   : Up to 24 hours
Physical Visit     : Within 48–72 hours
Outstation Visit   : Within 72–120 hours

Note: TAT is calculated from the time the ticket is assigned and all required information and prerequisites are complete. Delays due to merchant unavailability, rescheduling requests, public holidays, remote locations, unexpected emergencies or force majeure are excluded from the committed TAT. Onsite Visit TAT is subject to the real-time availability of resources at or near the outlet location.

Regards,
TL's Name & Signature`
  }
];

const select = document.getElementById('templateSelect');
const editor = document.getElementById('editor');
const metaLine = document.getElementById('metaLine');
const toast = document.getElementById('toast');

templates.forEach((t, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `${t.sn} — ${t.title}`;
  select.appendChild(opt);
});

function loadTemplate(i){
  const t = templates[i];
  editor.value = t.body;
  metaLine.textContent = t.meta;
  metaLine.classList.add('show');
}

select.addEventListener('change', () => loadTemplate(select.value));

document.getElementById('resetBtn').addEventListener('click', () => {
  loadTemplate(select.value);
  showToast('Content reset');
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const text = editor.value;
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
});

function fallbackCopy(text){
  editor.focus();
  editor.select();
  try{
    document.execCommand('copy');
    showToast('Copied to clipboard');
  }catch(e){
    showToast('Copy failed — select manually');
  }
}

let toastTimer;
function showToast(msg){
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

// initial load
loadTemplate(0);
</script>
</body>
</html>
